    <script>
        const welcomeAccountStatus = document.getElementById('welcome-account-status');
        const welcomeAccountEmail = document.getElementById('welcome-account-email');
        const welcomeAccountSignIn = document.getElementById('welcome-account-sign-in');
        const welcomeAccountSignOut = document.getElementById('welcome-account-sign-out');

        function setWelcomeAccountControlVisible(control, visible) {
            control.hidden = !visible;
            control.style.display = visible ? 'block' : 'none';
        }

        function initializeWelcomeAccount() {
            if (!window.CORE_FIREBASE_CONFIG) return;

            try {
                firebase.initializeApp(window.CORE_FIREBASE_CONFIG);
                const auth = firebase.auth();
                const provider = new firebase.auth.GoogleAuthProvider();

                welcomeAccountSignIn.addEventListener('click', () => {
                    welcomeAccountStatus.textContent = 'OPENING GOOGLE SIGN-IN...';
                    auth.signInWithPopup(provider).catch(() => {
                        welcomeAccountStatus.textContent = 'SIGN-IN FAILED - TRY AGAIN';
                    });
                });
                welcomeAccountSignOut.addEventListener('click', () => auth.signOut());
                auth.onAuthStateChanged((user) => {
                    if (!user) {
                        welcomeAccountStatus.textContent = 'GUEST ACCESS';
                        welcomeAccountEmail.hidden = true;
                        setWelcomeAccountControlVisible(welcomeAccountSignIn, true);
                        setWelcomeAccountControlVisible(welcomeAccountSignOut, false);
                        return;
                    }

                    welcomeAccountStatus.textContent = user.displayName || user.email || 'SIGNED-IN USER';
                    welcomeAccountEmail.textContent = user.email || '';
                    welcomeAccountEmail.hidden = !user.email;
                    setWelcomeAccountControlVisible(welcomeAccountSignIn, false);
                    setWelcomeAccountControlVisible(welcomeAccountSignOut, true);
                });
            } catch {
                welcomeAccountStatus.textContent = 'ACCOUNT UNAVAILABLE';
            }
        }

        initializeWelcomeAccount();
    </script>
    <script>
        const gridCanvas = document.getElementById('background-grid');
        const gridContext = gridCanvas.getContext('2d');
        const gridPointer = { x: -1000, y: -1000 };
        const customCursor = document.querySelector('.custom-cursor');
        const particleElements = [...document.querySelectorAll('.spec-field i')];
        const particleLaunchDuration = 3200;
        const particleStartTime = performance.now();
        particleElements.forEach((particle, index) => {
            const orbitDuration = parseFloat(particle.style.getPropertyValue('--speed')) * 1.8;
            particle.dataset.orbitDuration = `${orbitDuration * 1000}`;
            particle.dataset.angle = particle.style.getPropertyValue('--angle').replace('deg', '');
            particle.dataset.radius = particle.style.getPropertyValue('--radius').replace('px', '');
            particle.dataset.launchDelay = `${(index % 8) * 38 + Math.floor(index / 8) * 8}`;
        });
        const gridNodes = [];
        const ambientObjects = [];
        const gridSpacing = 42;
        let gridColumns = 0;
        let gridRows = 0;
        const gridMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function resizeBackgroundGrid() {
            const scale = Math.min(window.devicePixelRatio || 1, 1.5);
            gridCanvas.width = window.innerWidth * scale;
            gridCanvas.height = window.innerHeight * scale;
            gridCanvas.style.width = `${window.innerWidth}px`;
            gridCanvas.style.height = `${window.innerHeight}px`;
            gridContext.setTransform(scale, 0, 0, scale, 0, 0);
            gridNodes.length = 0;
            ambientObjects.length = 0;
            gridColumns = Math.ceil(window.innerWidth / gridSpacing) + 2;
            gridRows = Math.ceil(window.innerHeight / gridSpacing) + 2;

            for (let row = 0; row < gridRows; row += 1) {
                const y = (row - 1) * gridSpacing;
                for (let column = 0; column < gridColumns; column += 1) {
                    const x = (column - 1) * gridSpacing;
                    gridNodes.push({ x, y, homeX: x, homeY: y, vx: 0, vy: 0, phase: Math.random() * Math.PI * 2 });
                }
            }

            for (let index = 0; index < 52; index += 1) {
                ambientObjects.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: 1.2 + Math.random() * 3.2,
                    depth: 0.25 + Math.random() * 0.75,
                    phase: Math.random() * Math.PI * 2,
                    cross: Math.random() > 0.78
                });
            }
        }

        function animateParticleField(now) {
            const elapsed = now - particleStartTime;
            const startRadius = Math.hypot(window.innerWidth, window.innerHeight) + 220;

            particleElements.forEach((particle) => {
                const particleElapsed = Math.max(0, elapsed - Number(particle.dataset.launchDelay));
                const launchProgress = Math.min(particleElapsed / particleLaunchDuration, 1);
                const radialProgress = 1 - ((1 - launchProgress) ** 3);
                const angularProgress = launchProgress * launchProgress * (2 - launchProgress);
                const orbitDuration = Number(particle.dataset.orbitDuration);
                const baseAngle = Number(particle.dataset.angle);
                const radius = Number(particle.dataset.radius);
                const handoffDegrees = particleLaunchDuration / orbitDuration * 360;
                const currentAngle = baseAngle + (angularProgress * handoffDegrees);
                const currentRadius = startRadius + ((radius - startRadius) * radialProgress);

                if (launchProgress < 1) {
                    particle.style.opacity = `${0.2 + radialProgress * 0.8}`;
                } else {
                    particle.style.opacity = '1';
                }

                const orbitElapsed = Math.max(0, particleElapsed - particleLaunchDuration);
                const orbitAngle = currentAngle + (orbitElapsed / orbitDuration * 360);
                const displayRadius = launchProgress < 1 ? currentRadius : radius;
                particle.style.transform = `rotate(${orbitAngle}deg) translateX(${displayRadius}px) scale(1)`;
            });

        }

        function drawBackgroundGrid(time) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            gridContext.clearRect(0, 0, width, height);
            gridContext.lineWidth = 0.65;

            const ambientGradient = gridContext.createRadialGradient(width * 0.5, height * 0.42, 0, width * 0.5, height * 0.42, width * 0.72);
            ambientGradient.addColorStop(0, 'rgba(45, 72, 160, 0.045)');
            ambientGradient.addColorStop(0.46, 'rgba(20, 36, 92, 0.014)');
            ambientGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            gridContext.fillStyle = ambientGradient;
            gridContext.fillRect(0, 0, width, height);

            const redCloud = gridContext.createRadialGradient(width * 0.16, height * 0.3, 0, width * 0.16, height * 0.3, width * 0.42);
            redCloud.addColorStop(0, 'rgba(190, 38, 32, 0.028)');
            redCloud.addColorStop(1, 'rgba(255, 54, 35, 0)');
            gridContext.fillStyle = redCloud;
            gridContext.fillRect(0, 0, width, height);

            const blueCloud = gridContext.createRadialGradient(width * 0.78, height * 0.62, 0, width * 0.78, height * 0.62, width * 0.46);
            blueCloud.addColorStop(0, 'rgba(37, 78, 204, 0.032)');
            blueCloud.addColorStop(1, 'rgba(47, 101, 255, 0)');
            gridContext.fillStyle = blueCloud;
            gridContext.fillRect(0, 0, width, height);

            if (gridPointer.x > -500) {
                const pointerGlow = gridContext.createRadialGradient(gridPointer.x, gridPointer.y, 0, gridPointer.x, gridPointer.y, 250);
                pointerGlow.addColorStop(0, 'rgba(255, 112, 52, 0.18)');
                pointerGlow.addColorStop(0.32, 'rgba(92, 126, 255, 0.08)');
                pointerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                gridContext.fillStyle = pointerGlow;
                gridContext.fillRect(0, 0, width, height);
            }

            for (const object of ambientObjects) {
                const drift = Math.sin(time * 0.00035 * object.depth + object.phase) * 18 * object.depth;
                const starAlpha = 0.18 + object.depth * 0.28;
                gridContext.fillStyle = `rgba(169, 198, 255, ${starAlpha})`;
                gridContext.beginPath();
                gridContext.arc(object.x + drift, object.y, object.radius * object.depth, 0, Math.PI * 2);
                gridContext.fill();

                if (object.cross) {
                    gridContext.strokeStyle = `rgba(218, 231, 255, ${starAlpha * 0.72})`;
                    gridContext.lineWidth = 1;
                    gridContext.beginPath();
                    gridContext.moveTo(object.x + drift - 7, object.y);
                    gridContext.lineTo(object.x + drift + 7, object.y);
                    gridContext.moveTo(object.x + drift, object.y - 7);
                    gridContext.lineTo(object.x + drift, object.y + 7);
                    gridContext.stroke();
                }
            }

            if (clickPulse.life > 0.02) {
                clickPulse.radius += 2.5;
                clickPulse.life -= 0.018;
            }

            for (const node of gridNodes) {
                const dx = node.homeX - gridPointer.x;
                const dy = node.homeY - gridPointer.y;
                const distance = Math.hypot(dx, dy) || 1;
                const influence = Math.max(0, 1 - distance / 270);
                const push = influence * influence * 30;
                const targetX = node.homeX - (dx / distance) * push;
                const targetY = node.homeY - (dy / distance) * push;

                node.vx += (targetX - node.x) * 0.04;
                node.vy += (targetY - node.y) * 0.04;

                if (clickPulse.life > 0.02) {
                    const pulseDx = node.homeX - clickPulse.x;
                    const pulseDy = node.homeY - clickPulse.y;
                    const pulseDistance = Math.hypot(pulseDx, pulseDy) || 1;
                    const pulseFalloff = Math.max(0, 1 - pulseDistance / (clickPulse.radius + 35));
                    const pulseStrength = pulseFalloff * clickPulse.strength * clickPulse.life;

                    if (pulseDistance > 0) {
                        const pulseDirX = pulseDx / pulseDistance;
                        const pulseDirY = pulseDy / pulseDistance;
                        node.vx += pulseDirX * pulseStrength * 0.35;
                        node.vy += pulseDirY * pulseStrength * 0.35;
                    }
                }

                node.vx *= 0.82;
                node.vy *= 0.82;
                node.x += node.vx;
                node.y += node.vy;
            }

            for (let row = 0; row < gridRows - 1; row += 1) {
                for (let column = 0; column < gridColumns - 1; column += 1) {
                    const topLeft = gridNodes[row * gridColumns + column];
                    const topRight = gridNodes[row * gridColumns + column + 1];
                    const bottomLeft = gridNodes[(row + 1) * gridColumns + column];
                    const bottomRight = gridNodes[(row + 1) * gridColumns + column + 1];
                    const centerX = (topLeft.x + topRight.x + bottomLeft.x + bottomRight.x) * 0.25;
                    const centerY = (topLeft.y + topRight.y + bottomLeft.y + bottomRight.y) * 0.25;
                    const distance = Math.hypot(centerX - gridPointer.x, centerY - gridPointer.y) || 1;
                    const influence = Math.max(0, 1 - distance / 240);
                    const pulse = 0.5 + Math.sin(time * 0.001 + row * 0.7 + column * 0.45) * 0.5;
                    const shatterDistance = Math.hypot(centerX - clickPulse.x, centerY - clickPulse.y);
                    const shatterInfluence = clickPulse.life > 0.02
                        ? Math.max(0, 1 - shatterDistance / (clickPulse.radius + 32)) * clickPulse.life
                        : 0;
                    const alpha = (0.055 + influence * 0.16 + pulse * 0.018) * (1 - shatterInfluence);
                    const firstTriangle = (row + column) % 2 === 0;
                    gridContext.beginPath();
                    if (firstTriangle) {
                        gridContext.moveTo(topLeft.x, topLeft.y);
                        gridContext.lineTo(topRight.x, topRight.y);
                        gridContext.lineTo(bottomRight.x, bottomRight.y);
                        gridContext.closePath();
                        gridContext.moveTo(topLeft.x, topLeft.y);
                        gridContext.lineTo(bottomRight.x, bottomRight.y);
                        gridContext.lineTo(bottomLeft.x, bottomLeft.y);
                    } else {
                        gridContext.moveTo(topLeft.x, topLeft.y);
                        gridContext.lineTo(topRight.x, topRight.y);
                        gridContext.lineTo(bottomLeft.x, bottomLeft.y);
                        gridContext.closePath();
                        gridContext.moveTo(topRight.x, topRight.y);
                        gridContext.lineTo(bottomRight.x, bottomRight.y);
                        gridContext.lineTo(bottomLeft.x, bottomLeft.y);
                    }
                    gridContext.closePath();
                    gridContext.fillStyle = `rgba(${firstTriangle ? '64, 99, 188' : '37, 62, 128'}, ${alpha})`;
                    gridContext.fill();
                    gridContext.strokeStyle = `rgba(103, 148, 255, ${alpha * 1.35})`;
                    gridContext.stroke();
                }
            }

            for (let index = shatterPieces.length - 1; index >= 0; index -= 1) {
                const piece = shatterPieces[index];
                piece.x += piece.vx;
                piece.y += piece.vy;
                piece.vy += 0.08;
                piece.z += piece.vz;
                piece.vz *= 0.985;
                piece.rotation += piece.spin;
                piece.depthRotation += piece.depthSpin;
                piece.life -= 0.024;

                if (piece.life <= 0) {
                    shatterPieces.splice(index, 1);
                    continue;
                }

                const perspective = 1 + piece.z / 260;
                const tilt = 0.18 + Math.abs(Math.cos(piece.depthRotation)) * 0.82;
                const projectedPoints = piece.points.map((point) => {
                    const rotatedX = point.x * Math.cos(piece.rotation) - point.y * Math.sin(piece.rotation);
                    const rotatedY = point.x * Math.sin(piece.rotation) + point.y * Math.cos(piece.rotation);
                    return {
                        x: rotatedX * perspective,
                        y: rotatedY * perspective * tilt
                    };

                const edgeDepth = 2.5 + piece.z * 0.035;

                gridContext.save();
                gridContext.translate(piece.x, piece.y);
                gridContext.globalAlpha = piece.life * 0.86;
                gridContext.beginPath();
                projectedPoints.forEach((point, pointIndex) => {

                    const sideY = point.y + edgeDepth * 0.7;
                    if (pointIndex === 0) gridContext.moveTo(sideX, sideY);
                    else gridContext.lineTo(sideX, sideY);

                gridContext.closePath();
                gridContext.fillStyle = 'rgba(3, 7, 17, 0.92)';

                projectedPoints.forEach((point, pointIndex) => {

        const clickPulse = { x: -1000, y: -1000, radius: 0, strength: 0, life: 0 };

            clickPulse.x = x;

            const addTrianglePiece = (vertices, color) => {
                const centerX = vertices.reduce((sum, vertex) => sum + vertex.x, 0) / vertices.length;
                const centerY = vertices.reduce((sum, vertex) => sum + vertex.y, 0) / vertices.length;
                const distance = Math.hypot(centerX - x, centerY - y) || 1;
                const directionX = (centerX - x) / distance;
                const directionY = (centerY - y) / distance;
                const speed = (1.4 + Math.random() * 2.6) * intensity;
                shatterPieces.push({
                    x: centerX,
                    y: centerY,
                    vx: directionX * speed + (Math.random() - 0.5) * 0.9,
                    vy: directionY * speed + (Math.random() - 0.5) * 0.9,
                    points: vertices.map((vertex) => ({ x: vertex.x - centerX, y: vertex.y - centerY })),
                    rotation: 0,
                    spin: (Math.random() - 0.5) * 0.08,
                    life: 0.92 + Math.random() * 0.12,
                    color,
                    highlight: 0.35 + Math.random() * 0.65

                for (let column = 0; column < gridColumns - 1; column += 1) {
                    const topLeft = gridNodes[row * gridColumns + column];
                    const topRight = gridNodes[row * gridColumns + column + 1];
                    const bottomLeft = gridNodes[(row + 1) * gridColumns + column];
                    const bottomRight = gridNodes[(row + 1) * gridColumns + column + 1];
                    const centerX = (topLeft.x + topRight.x + bottomLeft.x + bottomRight.x) * 0.25;
                    const centerY = (topLeft.y + topRight.y + bottomLeft.y + bottomRight.y) * 0.25;
                    if (Math.hypot(centerX - x, centerY - y) > 155) continue;

                    const firstTriangle = (row + column) % 2 === 0;
                    const triangleColor = firstTriangle ? [64, 99, 188] : [37, 62, 128];
                    if (firstTriangle) {
                        addTrianglePiece([topLeft, topRight, bottomRight], triangleColor);
                        addTrianglePiece([topLeft, bottomRight, bottomLeft], triangleColor);
                    } else {
                        addTrianglePiece([topLeft, topRight, bottomLeft], triangleColor);
                        addTrianglePiece([topRight, bottomRight, bottomLeft], triangleColor);
                    }
                }
            }

        }

        const hudTime = document.getElementById('hud-time');
        const hudLocation = document.getElementById('hud-location');
        const hudTimeFormatter = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

        // splits text into per-letter spans that converge into place, mirroring the WELCOME title reveal
        function revealHudText(el, text) {
            el.innerHTML = '';
            [...text].forEach((char, index) => {
                const letter = document.createElement('span');
                letter.textContent = char === ' ' ? '\u00A0' : char;
                letter.style.setProperty('--letter-x', `${(Math.random() - 0.5) * 90}px`);
                letter.style.setProperty('--letter-y', `${(Math.random() - 0.5) * 60}px`);
                letter.style.setProperty('--letter-r', `${(Math.random() - 0.5) * 40}deg`);
                letter.style.animationDelay = `${index * 0.025}s`;
                letter.classList.add('hud-letter-in');
                el.appendChild(letter);
            });
        }

        let hudTimeRevealed = false;
        function updateHudTime() {
            const formatted = hudTimeFormatter.format(new Date());
            if (!hudTimeRevealed) {
                revealHudText(hudTime, formatted);
                hudTimeRevealed = true;
            } else {
                hudTime.textContent = formatted;
            }
        }

        updateHudTime();
        window.setInterval(updateHudTime, 1000);

        // fall back to a timezone-derived city guess if IP lookup is unavailable
        function fallbackHudLocation() {
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            const city = timeZone.split('/').pop()?.replace(/_/g, ' ') || 'UNKNOWN';
            revealHudText(hudLocation, city.toUpperCase());
        }

        fetch('https://ipapi.co/json/')
            .then((response) => (response.ok ? response.json() : Promise.reject(response.status)))
            .then((data) => {
                const parts = [data.city, data.country_name].filter(Boolean);
                if (parts.length) {
                    revealHudText(hudLocation, parts.join(', ').toUpperCase());
                } else {
                    fallbackHudLocation();
                }
            })
            .catch(fallbackHudLocation);

        const hudSession = document.getElementById('hud-session');
        const sessionStart = Date.now();

        function formatSessionDuration(elapsedMs) {
            const totalSeconds = Math.floor(elapsedMs / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const pad = (value) => String(value).padStart(2, '0');
            return hours > 0 ? `${pad(hours)}:${pad(minutes)}:${pad(seconds)}` : `${pad(minutes)}:${pad(seconds)}`;
        }

        let hudSessionRevealed = false;
        function updateHudSession() {
            const formatted = formatSessionDuration(Date.now() - sessionStart);
            if (!hudSessionRevealed) {
                revealHudText(hudSession, formatted);
                hudSessionRevealed = true;
            } else {
                hudSession.textContent = formatted;
            }
        }

        updateHudSession();
        window.setInterval(updateHudSession, 1000);
    </script>
</body>
</html>
