<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOCIALS</title>
    <link rel="icon" type="image/png" href="../WEBSITE LOGO.png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: radial-gradient(circle at top, rgba(0, 191, 255, 0.12), transparent 18%),
                        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.08), transparent 14%),
                        #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        body {
            padding: 0;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: flex-start;
        }

        .back-home-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border: 1px solid rgba(0, 191, 255, 0.7);
            border-radius: 999px;
            color: #00bfff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.35);
            box-shadow: 0 0 18px rgba(0, 191, 255, 0.2);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .back-home-btn:hover {
            transform: translateY(-2px);
            background: rgba(0, 191, 255, 0.08);
            box-shadow: 0 0 24px rgba(0, 191, 255, 0.35);
        }

        .socials-container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .header-title {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(0, 191, 255, 0.7);
        }

        .header-subtitle {
            color: #00bfff;
            font-size: 0.95rem;
            letter-spacing: 1px;
            margin-bottom: 40px;
            text-shadow: 0 0 14px rgba(0, 191, 255, 0.6);
        }

        .socials-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin-top: 30px;
        }

        .social-card {
            width: 180px;
            min-width: 160px;
            background: rgba(10, 10, 10, 0.92);
            border-radius: 18px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(0, 191, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            text-decoration: none;
        }

        .social-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 191, 255, 0.7);
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.35), inset 0 0 0 1px rgba(0, 191, 255, 0.4);
        }

        .social-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ffffff;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.85);
        }

        .social-card:hover .social-icon {
            color: #ffffff;
            text-shadow: 0 0 24px rgba(255, 255, 255, 0.9);
        }

        .social-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .social-handle {
            color: #88c7ff;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(0, 191, 255, 0.25);
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="back-home-btn">← BACK TO CORE</a>
    </header>

    <main class="content-sections">
        <div class="socials-container">
            <h1 class="header-title">Socials</h1>
            <p class="header-subtitle">CONNECT WITH ME</p>

            <div class="socials-grid">
                <!-- Twitter / X -->
                <a href="https://discord.com" class="social-card" target="_blank" rel="noopener noreferrer">
                    <div class="social-icon"><i class="fab fa-discord"></i></div>
                    <div class="social-name">DISCORD</div>
                    <div class="social-handle">@officialgerard</div>
                </a>

                <!-- GitHub -->
                <a href="https://github.com" class="social-card" target="_blank" rel="noopener noreferrer">
                    <div class="social-icon"><i class="fab fa-github"></i></div>
                    <div class="social-name">GitHub</div>
                    <div class="social-handle">Jack Kaylie</div>
                </a>

                <!-- Instagram -->
                <a href="https://instagram.com" class="social-card" target="_blank" rel="noopener noreferrer">
                    <div class="social-icon"><i class="fab fa-instagram"></i></div>
                    <div class="social-name">Instagram</div>
                    <div class="social-handle">@Jack k</div>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/@Alpha_1_Edits" class="social-card" target="_blank" rel="noopener noreferrer">
                    <div class="social-icon"><i class="fab fa-youtube"></i></div>
                    <div class="social-name">YouTube</div>
                    <div class="social-handle">Alpha1</div>
                </a>
            </div>
        </div>
    </main>

    <footer>
        <p></p>
    </footer>

</body>
</html>
